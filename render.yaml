# Render Blueprint — backend service definition.
#
# Lives at the repo root because that is where Render looks for it. The
# frontend is NOT here: it deploys to Vercel (frontend/vercel.json), which
# proxies /api/* to this service so the auth cookies stay first-party.
# See docs/decisions/DECISIONS.md 017 and 019.
#
# Create the service with: Render dashboard → New → Blueprint → pick this repo.
# Values marked `sync: false` are prompted for once, at creation time.

services:
  - type: web
    name: hikecast-api
    runtime: docker
    plan: free # 750 instance-hours/month; spins down after 15 min idle
    region: frankfurt # closest to the users and to the Neon project

    # dockerfilePath and dockerContext are resolved from the REPOSITORY ROOT,
    # not from any service root — so both are spelled out from the top. The
    # context is backend/ so that backend/.dockerignore applies and the
    # frontend never enters the build.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    healthCheckPath: /health

    envVars:
      # Paste the Neon connection string verbatim — the libpq form
      # (postgresql://…?sslmode=require) is normalized in app/core/config.py.
      - key: DATABASE_URL
        sync: false

      # Generated by Render as a long random value, which sidesteps the
      # too-short-secret problem the dev .env has (26 bytes; pyjwt warns).
      # Never reuse the development secret in production.
      - key: JWT_SECRET
        generateValue: true

      # HTTPS everywhere in production, so the cookies can demand it.
      - key: COOKIE_SECURE
        value: "true"

      # The Vercel origin, e.g. https://hikecast.vercel.app
      - key: CORS_ORIGINS
        sync: false

    # PORT is injected by Render (and bound by the Dockerfile's CMD).
    # ANTHROPIC_API_KEY is deliberately unset: AI stays on hold and the
    # endpoint returns 503 by design (DECISIONS 012).
